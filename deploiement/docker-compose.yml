name: horizon-immo

services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${HORIZON_IMAGE:?HORIZON_IMAGE manquante}
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?schema=public

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}

      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL manquant}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD manquant}

      SEED_AGENT_1_EMAIL: ${SEED_AGENT_1_EMAIL:?}
      SEED_AGENT_1_PASSWORD: ${SEED_AGENT_1_PASSWORD:?}
      SEED_AGENT_2_EMAIL: ${SEED_AGENT_2_EMAIL:?}
      SEED_AGENT_2_PASSWORD: ${SEED_AGENT_2_PASSWORD:?}

      SEED_USER_1_EMAIL: ${SEED_USER_1_EMAIL:?}
      SEED_USER_1_PASSWORD: ${SEED_USER_1_PASSWORD:?}
      SEED_USER_2_EMAIL: ${SEED_USER_2_EMAIL:?}
      SEED_USER_2_PASSWORD: ${SEED_USER_2_PASSWORD:?}

    volumes:
      - annonces_uploads:/app/public/annonces/uploads
      - anciennes_images:/app/public/images

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
  annonces_uploads:
  anciennes_images:
